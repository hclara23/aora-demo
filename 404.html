<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex" />
    <title>AORA</title>
    <script>
      const path = location.pathname;
      if (path.startsWith('/aora-demo/member/')) {
        try {
          sessionStorage.setItem('aora.demo.deep-link', path + location.search + location.hash);
        } catch {}
        location.replace('/aora-demo/member/');
      } else if (path.startsWith('/aora-demo/console')) {
        location.replace('/aora-demo/console.html');
      } else location.replace('/aora-demo/');
    </script>
  </head>
  <body>
    <a href="/aora-demo/">Return to AORA</a>
  </body>
</html>
